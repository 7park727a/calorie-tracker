<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Учёт калорий</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        /* Стилизация скроллбара */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .btn-press:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body class="bg-amber-50/60 text-slate-800 antialiased min-h-screen flex flex-col justify-between max-w-md mx-auto relative select-none">

    <!-- Шапка -->
    <header class="p-4 bg-white/80 backdrop-blur border-b border-amber-200/50 sticky top-0 z-10 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="font-bold text-lg text-slate-900 leading-tight">Дневник калорий</h1>
            <p class="text-xs text-slate-500">История приёмов пищи</p>
        </div>
        <button onclick="confirmReset()" class="px-3 py-1.5 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg transition-colors border border-rose-200/60">
            Сброс
        </button>
    </header>

    <!-- Основная область с таблицей -->
    <main class="flex-1 p-4 flex flex-col overflow-hidden">
        
        <!-- Контейнер таблицы -->
        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200/80 flex flex-col overflow-hidden">
            
            <!-- Заголовок таблицы -->
            <div class="grid grid-cols-2 bg-slate-50 px-4 py-2.5 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                <div>Время</div>
                <div class="text-right">Калории</div>
            </div>

            <!-- Список записей -->
            <div id="tableBody" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                <!-- Записи добавляются динамически -->
            </div>

            <!-- Итог -->
            <div class="bg-amber-100/60 px-4 py-3 border-t border-amber-200/80 flex justify-between items-center">
                <span class="font-bold text-slate-700 text-sm">Итого:</span>
                <span class="font-extrabold text-amber-900 text-lg"><span id="totalCalories">0</span> <span class="text-xs font-normal text-amber-800">ккал</span></span>
            </div>
        </div>

    </main>

    <!-- Нижний блок: Дисплей ввода и клавиатура -->
    <footer class="p-4 bg-white border-t border-slate-200/80 rounded-t-3xl shadow-lg flex flex-col gap-3">
        
        <!-- Дисплей текущего ввода -->
        <div class="bg-slate-100 rounded-xl px-4 py-3 flex justify-between items-center border border-slate-200 min-h-[52px]">
            <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Ввод:</span>
            <div class="flex items-baseline gap-1">
                <span id="inputDisplay" class="text-2xl font-bold text-slate-900 tracking-wider"></span>
                <span class="text-sm text-slate-500 font-medium">ккал</span>
            </div>
        </div>

        <!-- Цифровая клавиатура -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="pressNum('1')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">1</button>
            <button onclick="pressNum('2')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">2</button>
            <button onclick="pressNum('3')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">3</button>

            <button onclick="pressNum('4')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">4</button>
            <button onclick="pressNum('5')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">5</button>
            <button onclick="pressNum('6')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">6</button>

            <button onclick="pressNum('7')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">7</button>
            <button onclick="pressNum('8')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">8</button>
            <button onclick="pressNum('9')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">9</button>

            <button onclick="backspace()" class="btn-press bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-xl py-3.5 text-lg font-bold shadow-sm transition-all flex items-center justify-center">?</button>
            <button onclick="pressNum('0')" class="btn-press bg-slate-50 hover:bg-slate-100 border border-slate-200/80 rounded-xl py-3.5 text-xl font-bold text-slate-800 shadow-sm transition-all">0</button>
            <button onclick="submitData()" class="btn-press bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-3.5 text-xl font-bold shadow-sm transition-all flex items-center justify-center">?</button>
        </div>
    </footer>

    <!-- Модальное окно подтверждения сброса -->
    <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-5 max-w-xs w-full shadow-xl flex flex-col gap-4">
            <h3 class="font-bold text-lg text-slate-900">Очистить историю?</h3>
            <p class="text-xs text-slate-500">Все записанные данные о калориях за сегодня будут безвозвратно удалены.</p>
            <div class="flex gap-2 justify-end">
                <button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 rounded-lg">Отмена</button>
                <button onclick="resetData()" class="px-4 py-2 text-xs font-semibold text-white bg-rose-600 rounded-lg">Удалить</button>
            </div>
        </div>
    </div>

    <script>
        const MAX_ROWS = 10;
        let data = JSON.parse(localStorage.getItem('calorie_history_data')) || [];
        let currentInput = "";

        const inputDisplay = document.getElementById('inputDisplay');
        const tableBody = document.getElementById('tableBody');
        const totalCalories = document.getElementById('totalCalories');
        const modalBackdrop = document.getElementById('modalBackdrop');

        function updateDisplay() {
            inputDisplay.innerText = currentInput || "0";
        }

        function pressNum(num) {
            if (currentInput.length >= 5) return; // Ограничение длины
            if (currentInput === "0") currentInput = "";
            currentInput += num;
            updateDisplay();
        }

        function backspace() {
            currentInput = currentInput.slice(0, -1);
            updateDisplay();
        }

        function submitData() {
            let val = currentInput.trim();
            if (!val || parseInt(val, 10) === 0) return;

            let now = new Date();
            let timeString = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

            data.unshift({ time: timeString, value: parseInt(val, 10) });

            if (data.length > MAX_ROWS) {
                data.pop();
            }

            currentInput = "";
            updateDisplay();
            renderTable();
        }

        function confirmReset() {
            modalBackdrop.classList.remove('hidden');
            modalBackdrop.classList.add('flex');
        }

        function closeModal() {
            modalBackdrop.classList.add('hidden');
            modalBackdrop.classList.remove('flex');
        }

        function resetData() {
            data = [];
            localStorage.removeItem('calorie_history_data');
            currentInput = "";
            updateDisplay();
            renderTable();
            closeModal();
        }

        function renderTable() {
            tableBody.innerHTML = '';
            let sum = 0;

            if (data.length === 0) {
                tableBody.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center p-6 text-center text-slate-400">
                        <svg class="w-10 h-10 mb-2 stroke-current opacity-40" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                        </svg>
                        <p class="text-xs">Нет записей.<br>Введите калории с помощью кнопок снизу.</p>
                    </div>
                `;
            } else {
                data.forEach(item => {
                    sum += item.value;
                    let row = document.createElement('div');
                    row.className = 'grid grid-cols-2 px-4 py-3 text-sm items-center hover:bg-slate-50/80 transition-colors';
                    row.innerHTML = `
                        <div class="font-medium text-slate-500 text-xs">${item.time}</div>
                        <div class="text-right font-bold text-slate-800">${item.value} <span class="text-xs font-normal text-slate-400">ккал</span></div>
                    `;
                    tableBody.appendChild(row);
                });
            }

            totalCalories.innerText = sum.toLocaleString('ru-RU');
            localStorage.setItem('calorie_history_data', JSON.stringify(data));
        }

        // Инициализация при загрузке
        updateDisplay();
        renderTable();
    </script>
</body>
</html>
